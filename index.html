<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <title>Elijah Ally — Founder &amp; CEO, Cenova Spark</title>
    <meta
      name="description"
      content="Founder and CEO of Cenova Spark, a minority-owned federal software contractor. Full-stack and cloud engineer with an active TS/CI clearance. Two products in production: AddisDB and Towback."
    />
    <meta name="author" content="Elijah Ally" />
    <meta name="theme-color" content="#0d1116" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e7e9ec" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Elijah Ally — Founder &amp; CEO, Cenova Spark" />
    <meta
      property="og:description"
      content="I run a federal software company. I also write the code."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,300..800;1,400&display=swap"
      rel="stylesheet"
    />

    <script>
      // Set the theme before first paint so the page never flashes the wrong ground.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme =
            saved ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
